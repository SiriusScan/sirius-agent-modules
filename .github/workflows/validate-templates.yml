name: Validate Templates

on:
  push:
    branches: [main, develop]
    paths:
      - 'templates/**'
      - 'scripts/**'
      - 'tools/rebuild-manifests.go'
      - 'repository-manifest.json'
      - '.gitattributes'
      - '.github/workflows/validate-templates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/**'
      - 'tools/rebuild-manifests.go'
      - 'repository-manifest.json'
      - '.gitattributes'
      - '.github/workflows/validate-templates.yml'

permissions:
  contents: read

jobs:
  validate-templates:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the app-agent validator
        uses: actions/checkout@v4
        with:
          repository: SiriusScan/app-agent
          ref: 9df3f87a9f59e0fdb1f6237e46ca67b90b185378
          path: .app-agent-source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .app-agent-source/go.mod
          cache-dependency-path: .app-agent-source/go.sum

      - name: Validate template repository offline
        run: go -C .app-agent-source run ./cmd/template-cli validate-repository "$GITHUB_WORKSPACE"

      - name: Verify published manifests
        run: |
          go -C .app-agent-source run "$GITHUB_WORKSPACE/tools/rebuild-manifests.go" "$GITHUB_WORKSPACE"
          git diff --exit-code -- repository-manifest.json templates/manifest.json scripts/manifest.json
